<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ellis Wormhole — Simulation Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  #phase { color: #6F6A60; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }
  #bar   { width: 200px; height: 1px; background: #111; }
  #fill  { height: 100%; background: #D24F1B; width: 0%; }
  #data  { color: #2a2a2a; font-size: 9px; letter-spacing: 0.1em; }
  #hint  {
    position: fixed; top: 28px; right: 28px;
    color: #222; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    pointer-events: none;
  }
  #load  {
    position: fixed; inset: 0; background: #000; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    color: #2a2a2a; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    transition: opacity 1s ease;
  }
</style>
</head>
<body>
<div id="load">INITIALISING</div>
<canvas id="c"></canvas>
<div id="ui">
  <div id="phase">APPROACH</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="data">l = 8.000</div>
</div>
<div id="hint">SCROLL / DRAG TO TRAVERSE</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three'

// ─── constants ────────────────────────────────────────────
const THROAT  = 1.0    // throat radius a (world units)
const Z_START = 8.0    // camera start
const Z_END   = -8.0   // camera end
const HALF    = 0.5    // render scale factor (performance)

// ─── renderer ─────────────────────────────────────────────
const canvas   = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
renderer.setPixelRatio(1)
renderer.setSize(innerWidth, innerHeight)

// Half-res render target for the expensive raymarched pass
const rtW  = Math.floor(innerWidth  * HALF)
const rtH  = Math.floor(innerHeight * HALF)
const rt   = new THREE.WebGLRenderTarget(rtW, rtH, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format:    THREE.RGBAFormat,
  type:      THREE.UnsignedByteType,
})

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 2000)
camera.position.z = Z_START

// ─── procedural star cubemaps ─────────────────────────────
// warm  = amber / Frame-01 palette  (this universe)
// cool  = blue-white / Frame-03     (other universe)
function makeStarCubemap(isWarm) {
  const crt = new THREE.WebGLCubeRenderTarget(256, {
    format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
    generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter,
  })
  const cc = new THREE.CubeCamera(0.1, 2000, crt)
  const sc = new THREE.Scene()
  sc.background = new THREE.Color(0x000000)

  const N = 8000
  const p = new Float32Array(N * 3)
  const c = new Float32Array(N * 3)
  for (let i = 0; i < N; i++) {
    const th = Math.random() * Math.PI * 2
    const ph = Math.acos(2 * Math.random() - 1)
    const r  = 900
    p[i*3]   = r * Math.sin(ph) * Math.cos(th)
    p[i*3+1] = r * Math.sin(ph) * Math.sin(th)
    p[i*3+2] = r * Math.cos(ph)
    const br = Math.pow(Math.random(), 2.5) * 2.0 + 0.04
    if (isWarm) {
      c[i*3]   = br * (0.88 + Math.random() * 0.12)  // R high
      c[i*3+1] = br * (0.52 + Math.random() * 0.28)  // G mid
      c[i*3+2] = br * (0.04 + Math.random() * 0.12)  // B low
    } else {
      c[i*3]   = br * (0.18 + Math.random() * 0.25)  // R low
      c[i*3+1] = br * (0.48 + Math.random() * 0.30)  // G mid
      c[i*3+2] = br * (0.88 + Math.random() * 0.12)  // B high
    }
  }
  const geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3))
  geo.setAttribute('color',    new THREE.BufferAttribute(c, 3))
  sc.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 4, vertexColors: true, sizeAttenuation: false })))
  sc.add(cc)
  cc.update(renderer, sc)
  return crt
}

const cubeThis  = makeStarCubemap(true)
const cubeOther = makeStarCubemap(false)

// ─── wormhole shader ──────────────────────────────────────
// Raymarches Ellis wormhole null geodesics.
// 64 adaptive steps — covers the geodesic to < 1% error for |b/a - 1| > 0.05.
// Near-critical rays (Einstein ring zone) are detected by phi accumulation.
const WORM_VERT = /* glsl */`
in vec3 position;
in vec2 uv;
out vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`

const WORM_FRAG = /* glsl */`
#define PI     3.14159265358979
#define TWO_PI 6.28318530717959
#define STEPS  64

precision highp float;
in vec2 vUv;

uniform mat4       uInvProj;
uniform mat4       uInvView;
uniform vec3       uCamPos;
uniform float      uThroat;
uniform float      uCA;
uniform float      uTime;

uniform samplerCube uSkyThis;
uniform samplerCube uSkyOther;

out vec4 out_color;

// ── ray reconstruction ──────────────────────────────────
vec3 mkRay(vec2 uv) {
  vec4 c = vec4(uv * 2.0 - 1.0, 1.0, 1.0);
  vec4 v = uInvProj * c;
  v      = vec4(v.xy / v.w, -1.0, 0.0);
  return normalize((uInvView * v).xyz);
}

// ── chromatic aberration cubemap sample ─────────────────
vec3 cubeCA(samplerCube sky, vec3 d, float ca) {
  vec3 ax = abs(d.y) < 0.99 ? vec3(0,1,0) : vec3(1,0,0);
  vec3 p  = normalize(cross(ax, d));
  vec3 col;
  col.r = texture(sky, normalize(d + p *  ca)).r;
  col.g = texture(sky, d).g;
  col.b = texture(sky, normalize(d - p *  ca)).b;
  return col;
}

void main() {
  float a  = uThroat;
  vec3  rd = mkRay(vUv);

  // guard: camera must not be exactly at wormhole center
  vec3 cam = uCamPos;
  if (length(cam) < 0.02) cam.z = 0.02;

  float cam_r = length(cam);
  float l_cam = sqrt(max(0.0, cam_r*cam_r - a*a));

  // ── orbital plane ─────────────────────────────────────
  vec3  e_out = normalize(cam);                       // radial: wormhole → camera
  vec3  Lv    = cross(cam, rd);
  float b     = length(Lv);
  float boa   = b / a;

  vec3 orb_n = b > 1e-4 ? normalize(Lv) : vec3(0,1,0);
  vec3 e_phi = normalize(cross(orb_n, e_out));

  float dps = sign(dot(rd, e_phi));
  if (abs(dps) < 0.5) dps = 1.0;
  e_phi *= dps;

  // initial dl sign: −1 = toward throat
  float dl_s = dot(rd, e_out) >= 0.0 ? 1.0 : -1.0;

  // ── geodesic integration ─────────────────────────────
  // Ellis metric null geodesics:
  //   (dl/dλ)² = 1 − b²/(l²+a²)
  //   dφ/dλ    = b/(l²+a²)
  float l        = l_cam;
  float phi      = 0.0;
  float phi_acc  = 0.0;
  bool  refl     = false;
  bool  trav     = false;
  bool  captured = false;

  float l_exit = l_cam * 1.08 + 8.0 * a;
  // Base step covers the integration range in STEPS iterations.
  // Multiplied by proximity factor so steps are 10× finer near throat.
  float base = (l_cam + 6.0 * a) / float(STEPS);

  for (int i = 0; i < STEPS; i++) {
    float r2   = l*l + a*a;
    float prox = clamp(sqrt(r2) / (a * 2.5), 0.08, 1.0);
    float step = base * (0.08 + 0.92 * prox);

    float disc = 1.0 - b*b / r2;

    if (disc <= 0.0) {
      // Turning point — snap and reverse
      float ltp = sqrt(max(0.0, b*b - a*a));
      l    = ltp + 1e-4;
      dl_s = 1.0;
      refl = true;
      disc = max(0.0, 1.0 - b*b / (l*l + a*a));
    }

    l       += dl_s * sqrt(max(0.0, disc)) * step;
    phi     += (b / r2) * step;
    phi_acc += (b / r2) * step;

    if (!refl && l < 0.0 && dl_s < 0.0) trav = true;
    if (refl  && l >  l_exit) break;
    if (trav  && l < -l_exit) break;
    if (!refl && !trav && l > l_exit) break;
    if (phi_acc > TWO_PI * 2.0) { captured = true; break; }
  }

  // ── reconstruct exit direction ────────────────────────
  // At azimuth phi, in-plane basis:
  //   e_r(phi) = cos(phi)*e_rb + sin(phi)*e_phi
  //   e_t(phi) = −sin(phi)*e_rb + cos(phi)*e_phi
  // Exit velocity: radial = cos_e, tangential = sin_e
  //   cos_e = sqrt(1 − b²/r_exit²)
  //   sin_e = b / r_exit
  float r_ex  = sqrt(l*l + a*a);
  float sin_e = clamp(b / r_ex, 0.0, 1.0);
  float cos_e = sqrt(max(0.0, 1.0 - sin_e*sin_e));

  // Flip radial base for other-universe side (l < 0 ⟹ "outward" = −e_out)
  vec3 erb    = (l >= 0.0) ? e_out : -e_out;
  vec3 er_ex  = cos(phi)*erb  + sin(phi)*e_phi;
  vec3 et_ex  = -sin(phi)*erb + cos(phi)*e_phi;
  vec3 exdir  = normalize(cos_e*er_ex + sin_e*et_ex);

  // ── sample sky ────────────────────────────────────────
  // CA peaks sharply at b ≈ a (photon ring zone)
  float rim_ca = uCA * (1.0 + 8.0
    * smoothstep(0.45, 1.0, boa)
    * smoothstep(1.8,  1.0, boa));

  vec3 col;

  if (captured) {
    // Einstein ring: photon orbited > 2 full turns
    float ex = clamp((phi_acc - TWO_PI*2.0) / (TWO_PI*1.5), 0.0, 1.0);
    col = vec3(1.0, 1.04, 1.18) * (2.5 + ex * 5.0);

  } else if (trav) {
    // Traversed: sample other universe
    col = cubeCA(uSkyOther, exdir, rim_ca);

  } else {
    // Reflected: sample this universe
    col = cubeCA(uSkyThis, exdir, rim_ca);
    // Einstein ring glow on reflected side (b just above a)
    float ring = smoothstep(0.14, 0.0, abs(boa - 1.0)) * step(1.0, boa);
    // Subtle pulse tied to time for a faint breathing effect
    float pulse = 0.92 + 0.08 * sin(uTime * 1.2);
    col += vec3(0.82, 0.91, 1.0) * ring * 4.0 * pulse;
  }

  out_color = vec4(col, 1.0);
}
`

// ─── blit shader (half-res → full-res) ───────────────────
const BLIT_VERT = /* glsl */`
in vec3 position;
in vec2 uv;
out vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`
const BLIT_FRAG = /* glsl */`
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2      uTexelSize;
out vec4 out_color;

// 3-tap tent upscale — softens the half-res blockiness
void main() {
  vec3 c  = texture(uTex, vUv).rgb;
  vec3 n  = texture(uTex, vUv + vec2(0.0, uTexelSize.y)).rgb;
  vec3 e  = texture(uTex, vUv + vec2(uTexelSize.x, 0.0)).rgb;
  vec3 ne = texture(uTex, vUv + uTexelSize).rgb;
  out_color = vec4((c + n + e + ne) * 0.25, 1.0);
}
`

// ─── scenes and meshes ────────────────────────────────────
const wormScene = new THREE.Scene()
const blitScene = new THREE.Scene()
const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)

const wormMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3,
  vertexShader: WORM_VERT,
  fragmentShader: WORM_FRAG,
  depthWrite: false,
  depthTest: false,
  uniforms: {
    uInvProj:  { value: new THREE.Matrix4() },
    uInvView:  { value: new THREE.Matrix4() },
    uCamPos:   { value: new THREE.Vector3() },
    uThroat:   { value: THROAT },
    uCA:       { value: 0.0 },
    uTime:     { value: 0.0 },
    uSkyThis:  { value: cubeThis.texture },
    uSkyOther: { value: cubeOther.texture },
  },
})

const wormMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), wormMat)
wormMesh.frustumCulled = false
wormScene.add(wormMesh)

const blitMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3,
  vertexShader: BLIT_VERT,
  fragmentShader: BLIT_FRAG,
  depthWrite: false,
  depthTest: false,
  uniforms: {
    uTex:       { value: rt.texture },
    uTexelSize: { value: new THREE.Vector2(1 / rtW, 1 / rtH) },
  },
})

const blitMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat)
blitMesh.frustumCulled = false
blitScene.add(blitMesh)

// ─── camera input ─────────────────────────────────────────
let targetZ  = Z_START
let currentZ = Z_START
let dragY    = 0, dragging = false

window.addEventListener('wheel', e => {
  e.preventDefault()
  targetZ = Math.max(Z_END, Math.min(Z_START, targetZ - e.deltaY * 0.018))
}, { passive: false })

window.addEventListener('mousedown', e => { dragging = true; dragY = e.clientY })
window.addEventListener('mousemove', e => {
  if (!dragging) return
  targetZ = Math.max(Z_END, Math.min(Z_START, targetZ + (e.clientY - dragY) * 0.05))
  dragY = e.clientY
})
window.addEventListener('mouseup', () => dragging = false)
window.addEventListener('touchstart', e => { dragY = e.touches[0].clientY }, { passive: true })
window.addEventListener('touchmove', e => {
  e.preventDefault()
  targetZ = Math.max(Z_END, Math.min(Z_START, targetZ + (e.touches[0].clientY - dragY) * 0.05))
  dragY = e.touches[0].clientY
}, { passive: false })

// ─── ui ──────────────────────────────────────────────────
const fillEl  = document.getElementById('fill')
const phaseEl = document.getElementById('phase')
const dataEl  = document.getElementById('data')

function getPhase(z) {
  if (z >  4.5) return 'APPROACH'
  if (z >  2.2) return 'LENSING'
  if (z >  0.8) return 'NEAR PHOTON SPHERE'
  if (z > -0.8) return 'CROSSING'
  if (z > -2.2) return 'OTHER UNIVERSE'
  return 'TRAVERSED'
}

// ─── render loop ─────────────────────────────────────────
const clock = new THREE.Clock()
let loaded  = false

function tick() {
  requestAnimationFrame(tick)
  const t = clock.getElapsedTime()

  currentZ += (targetZ - currentZ) * 0.08
  camera.position.z = currentZ

  // CA peaks quadratically at throat (z≈0)
  const dist = Math.abs(currentZ)
  const ca   = Math.pow(Math.max(0, 1 - dist / 3.5), 2) * 0.022

  // Update wormhole uniforms every frame
  wormMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse)
  wormMat.uniforms.uInvView.value.copy(camera.matrixWorld)
  wormMat.uniforms.uCamPos.value.copy(camera.position)
  wormMat.uniforms.uCA.value   = ca
  wormMat.uniforms.uTime.value = t

  // Pass 1: wormhole → half-res RT
  renderer.setRenderTarget(rt)
  renderer.render(wormScene, orthoCamera)

  // Pass 2: blit → screen
  renderer.setRenderTarget(null)
  renderer.render(blitScene, orthoCamera)

  // UI
  const p = (Z_START - currentZ) / (Z_START - Z_END)
  fillEl.style.width  = `${Math.max(0, p * 100).toFixed(1)}%`
  phaseEl.textContent = getPhase(currentZ)
  dataEl.textContent  = `l = ${currentZ.toFixed(3)}  |  b_crit = ${THROAT.toFixed(2)}  |  ca = ${ca.toFixed(4)}`

  if (!loaded) {
    loaded = true
    const el = document.getElementById('load')
    el.style.opacity = '0'
    setTimeout(() => el.remove(), 1000)
  }
}

// ─── resize ──────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
  const w = Math.floor(innerWidth * HALF)
  const h = Math.floor(innerHeight * HALF)
  rt.setSize(w, h)
  blitMat.uniforms.uTexelSize.value.set(1 / w, 1 / h)
})

tick()
</script>
</body>
</html>
